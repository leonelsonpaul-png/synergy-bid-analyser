name: Tender analyser CI

on:
  push:
    branches: [feature/tender-analysis-pipeline]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check --no-lock supabase/functions/tender-analysis/index.ts
